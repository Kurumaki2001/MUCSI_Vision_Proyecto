# Configuración del proyecto: emparejar puntos y números.
# Las rutas son relativas a la carpeta del proyecto (la de este fichero).

# -----------------------------------------------------------------------------
# Generador de datos sintéticos (python -m data.generate)
#
# Simula fotos de una ficha A4 de "unir los puntos" tomadas desde arriba con una
# cámara cenital. Las medidas de la hoja van en milímetros y se pasan a píxeles
# con la resolución de la cámara sobre el papel (px_per_mm).
# -----------------------------------------------------------------------------
generator:
  seed: 42
  output: data/synthetic
  splits: {train: 2000, val: 300, test: 200}   # número de fotos de cada partición
  processes: 12               # procesos en paralelo (no cambia el resultado, solo la velocidad)
  samples_with_boxes: 12      # fotos de train que se guardan también con las cajas dibujadas

  sheet:
    size_mm: [210, 297]       # A4 en vertical (ancho, alto)
    margin_mm: [12, 22]       # margen sin puntos alrededor de la hoja
    paper_white: [232, 252]   # nivel de blanco del papel (0-255)
    paper_tint: 4             # desviación máxima de cada canal respecto a ese blanco

  camera:
    px_per_mm: [4.0, 8.0]     # resolución sobre el papel. Orientativo: una cámara Full HD que
                              # encuadra el A4 da unos 4 px/mm; una 4K, unos 7-8 px/mm
    aspect_ratio: 0.75        # ancho / alto de la foto (3:4 en vertical)
    sheet_fill: [0.82, 0.95]  # fracción del alto de la foto que ocupa la hoja (el resto es mesa)
    max_rotation_deg: 3       # giro máximo de la hoja respecto a la cámara (±)
    perspective: 0.015        # desplazamiento máximo de cada esquina (fracción del lado de la hoja):
                              # la cámara no está perfectamente perpendicular

  dots:
    count: [15, 120]          # N: puntos numerados del 1 al N (si alguno no cabe, salen menos)
    diameter_mm: [1.4, 3.5]   # diámetro de los puntos de una hoja
    diameter_variation: 0.08  # variación relativa del diámetro entre puntos de la misma hoja
    shape_probability: 0.7    # probabilidad de colocar los puntos por el contorno de una figura,
                              # como en las fichas reales; si no, se reparten al azar

  numbers:
    size_pt: [8, 16]          # cuerpo de letra en puntos tipográficos (1 pt = 0,353 mm)
    gap_mm: [0.3, 2.5]        # hueco entre el borde del punto y la caja de su número
    separation_mm: 1.0        # separación mínima entre objetos que no son pareja
    thicken_probability: 0.15 # probabilidad de engrosar el trazo de los números de una hoja
    # Fuentes TrueType para cv2.FontFace: se buscan en las carpetas de fuentes del sistema.
    # "sans" es la que trae OpenCV 5: así siempre hay al menos una, aunque falten las de Windows.
    fonts: [arial.ttf, arialbd.ttf, calibri.ttf, calibrib.ttf, times.ttf, timesbd.ttf,
            verdana.ttf, verdanab.ttf, tahoma.ttf, tahomabd.ttf, georgia.ttf, georgiab.ttf,
            cour.ttf, courbd.ttf, consola.ttf, comic.ttf, comicbd.ttf, segoeui.ttf,
            segoeuib.ttf, trebuc.ttf, DejaVuSans.ttf, DejaVuSans-Bold.ttf, DejaVuSerif.ttf,
            LiberationSans-Regular.ttf, sans]

  hard_cases:                 # casos difíciles (probabilidad por punto)
    touching_probability: 0.05    # el número toca su punto
    crowded_probability: 0.10     # el número se coloca casi pegado a los objetos vecinos
    crowded_separation_mm: 0.15

  ink:
    color_probability: 0.15   # hojas impresas en color en lugar de negro o gris oscuro
    different_dot_color_probability: 0.3   # en esas hojas, puntos y números de colores distintos

  distractors:                # negativos difíciles: se dibujan pero no se etiquetan
    title_probability: 0.6    # título y campos "Nombre:", "Fecha:"... en la parte de arriba
    loose_letters: [0, 10]    # letras y palabras cortas repartidas por la hoja
    hollow_circles: [0, 8]    # circunferencias sin rellenar

  effects:                    # aspecto de foto
    min_lighting: [0.70, 0.95]   # luz en la zona más oscura (1 = iluminación uniforme)
    shadow_probability: 0.35  # sombra suave sobre la foto (brazo de la cámara, una mano...)
    blur_sigma: [0.0, 1.2]
    noise_sigma: [1.0, 6.0]   # ruido del sensor, en niveles de gris (0-255)
    jpeg_quality: [60, 95]

# -----------------------------------------------------------------------------
# Dataset para YOLO (python -m ArtificialVision.prepare_yolo)
#
# Ultralytics reduce cada imagen hasta que su lado mayor mide imgsz. Una foto de
# 2800 px se quedaría a un tercio y los puntos con ella, así que las fotos se
# trocean en teselas de imgsz x imgsz a su tamaño original.
# -----------------------------------------------------------------------------
yolo:
  output: ArtificialVision/yolo_dataset
  classes: [dot, number]      # 0 = punto, 1 = número (una caja por número completo)
  overlap: 160                # píxeles compartidos entre teselas vecinas (más que el objeto mayor)
  min_visible_fraction: 0.3   # un objeto cortado por el borde de una tesela se etiqueta (con la caja
                              # recortada) si se ve al menos esta fracción de su caja. Así el "5"
                              # visible de un "45" cortado cuenta como número, que es lo que parece
  jpeg_quality: 95
  samples_with_boxes: 12      # teselas de train que se guardan con sus etiquetas dibujadas

# -----------------------------------------------------------------------------
# Entrenamiento (python -m ArtificialVision.train)
# -----------------------------------------------------------------------------
training:
  model: ArtificialVision/models/yolo26n.pt   # preentrenado en COCO; se descarga si no está
  imgsz: 1024                 # alto porque los objetos son pequeños (también es el lado de las teselas)
  epochs: 100
  patience: 20                # parada temprana: épocas seguidas sin mejorar en validación
  max_hours: 0.9              # límite de tiempo (null = sin límite). Ultralytics recalcula las
                              # épocas tras la primera para que el entrenamiento completo quepa
  batch: 16
  workers: 12                 # procesos que cargan y aumentan las imágenes (la CPU suele ser el cuello de botella)
  seed: 42
  fliplr: 0.0                 # sin volteo horizontal: los números nunca aparecen en espejo
  scale: 0.3                  # zoom aleatorio de ±30 % (el generador ya varía la resolución)
  degrees: 0.0                # sin giro extra: el generador ya gira la hoja y recalcula las cajas
  project: ArtificialVision/results/training
  name: yolo26n_dots_numbers
  final_model: ArtificialVision/models/yolo26n_dots_numbers.pt

# -----------------------------------------------------------------------------
# Inferencia (python -m ArtificialVision.pipeline <foto o carpeta>)
# -----------------------------------------------------------------------------
inference:
  model: ArtificialVision/models/yolo26n_dots_numbers.pt
  output: ArtificialVision/results/inference   # si no se indica --output, se guarda en <output>/<modo>
  max_side: 2900              # las fotos más grandes se reducen a esto: el modelo se entrenó con fotos de
                              # hasta ~2900 px (4-8 px/mm). Después se trocean en teselas, como al entrenar
  detection_confidence: 0.25  # umbral de confianza de YOLO
  max_detections: 1000        # máximo de objetos por tesela
  erase_margin: 0.3           # los puntos se borran con un círculo un 30 % mayor que el punto, del color
                              # del papel que lo rodea (en blanco, sobre papel gris, el OCR leía el borde)
  ocr_mode: crops             # page: EasyOCR busca y lee el texto en toda la foto;
                              # crops: EasyOCR lee cada caja "number" de YOLO como una sola línea
  ocr_min_confidence: 0.3     # lecturas con menos confianza se descartan (en crops, el número se queda
                              # en el emparejamiento con value null)
  crop_margin: 0.2            # modo crops: margen alrededor de cada caja (fracción de su altura)
  page_params:                # modo page: parámetros de reader.readtext de EasyOCR (ajustados con 15 fotos
                              # de validación; con los de por defecto se perdían muchos números pequeños)
    min_size: 5               # por defecto 20 px: descartaría los números pequeños
    width_ths: 0.1            # por defecto 0.5: con menos, no fusiona números cercanos en una sola caja
    mag_ratio: 1.5            # amplía la foto antes de buscar texto (los números son pequeños)
    text_threshold: 0.5       # por defecto 0.7 y 0.4: umbrales más bajos para no perder números
    low_text: 0.3
  join_in_order: false        # dibujar también la línea que une los puntos en orden numérico

# -----------------------------------------------------------------------------
# Coordenadas reales con ArUco (common/aruco_coords.py), para los dos enfoques
#
# Se usa la hoja de calibración de clase: A4 con 4 marcadores DICT_4X4_50,
# IDs 0-3, de 80 mm. Debe estar en el MISMO plano que la ficha de puntos (encima de la mesa).
# Si la referencia es válida, cada punto del JSON lleva también x_mm, y_mm (origen en la esquina superior
# izquierda de la hoja de ArUco, X a la derecha, Y hacia abajo) y se guarda <foto>_mm.csv.
# -----------------------------------------------------------------------------
aruco:
  enabled: true
  sheet: aruco_sheet/arucos_calibracion_A4.json        # posiciones reales de los marcadores
  detect_dictionary: DICT_4X4_1000   # se detectan todos los marcadores 4x4 (para no tomarlos por puntos);
                              # para medir solo cuentan los de la hoja
  lens_calibration: aruco_sheet/calibracion_camara.json  # de aruco_calibrate.py, para la cámara de
                              # clase (1280x960). Se ignora si la foto tiene otra relación de aspecto.
                              # null = no corregir la distorsión. PENDIENTE: recalibrar con la cámara del
                              # proyecto (1920x1080, 16:9); hasta entonces sus fotos van sin corrección
                              # de lente, porque la relación de aspecto no coincide
  min_markers: 2              # mínimo de marcadores para calcular la homografía (con 1 se extrapola mucho)
  refine_edges: true          # refinado sub-píxel de las esquinas por bordes
  captures: aruco_sheet/captures   # fotos de la hoja para recalibrar la lente
                              # (python -m common.aruco_capture y luego aruco_calibrate)
  exclusion_margin: 0.15      # se descarta lo detectado dentro de un marcador (agrandado un 15 %)
  max_rms_mm: 1.0             # error RMS máximo en las esquinas para exportar coordenadas

# -----------------------------------------------------------------------------
# Visión clásica (python -m ClassicVision.pipeline <foto o carpeta>)
#
# Solo OpenCV y reglas: nada se entrena. Las medidas relativas (fracciones, factores) hacen que
# los mismos valores sirvan para fotos de cualquier resolución.
# -----------------------------------------------------------------------------
classic:
  output: ClassicVision/results/inference
  # Hoja y tinta (ClassicVision/preprocess.py)
  paper_work_side: 800        # la hoja se busca en una copia reducida a este lado mayor (px)
  paper_min_fraction: 0.10    # una zona de papel debe ocupar al menos el 10 % de la foto
  paper_erode: 0.02           # la hoja se encoge un 2 % del lado mayor: fuera el borde, su sombra y la mesa
                              # (las fichas tienen márgenes de más de 1 cm sin puntos)
  background_kernel: 0.03     # núcleo del cierre que estima el papel: fracción del lado menor de la foto
                              # (mayor que cualquier punto o trazo, para que los borre)
  ink_threshold: [0.10, 0.18] # manchas más oscuras que el papel en un 10 % con algún píxel que lo sea en un 18 %
  ink_relative: 0.25          # y, dentro de cada mancha, solo lo que llega al 25 % de su oscuridad máxima
  min_blob_area: 6            # manchas más pequeñas (px) son ruido
  # Puntos (ClassicVision/dots.py)
  dot_min_radius_px: 2.0
  dot_min_fill: 0.75          # área / círculo mínimo que la contiene
  dot_min_roundness: 0.88     # eje menor / eje mayor de la elipse equivalente
  dot_min_solidity: 0.90      # área / envolvente convexa
  dot_size_band: [0.8, 1.25] # radio admitido respecto a la mediana de los candidatos
  split_min_area: 0.7         # manchas que no son puntos y miden más que esto x área de un punto se revisan
                              # (¿un punto con su número pegado?)
  split_kernel: 1.3           # diámetro de la apertura que separa punto y número, en radios de punto
  split_max_sectors: 5        # un punto separado así solo puede tocar tinta en 5 de 12 sectores (150°), seguidos
  erase_margin: 1.15          # los puntos se borran de la tinta con un círculo un 15 % mayor
  # Caracteres y números (ClassicVision/digits.py)
  char_min_height_px: 5
  char_max_aspect: 4.0        # más ancho que 4 veces su alto: es una raya, no un carácter
  char_height_band: [0.55, 1.6]   # alto admitido respecto a la mediana de los caracteres
  piece_overlap: 0.6          # dos trozos que se solapan en horizontal más de esto son un carácter
  split_aspect: 1.0           # una mancha más ancha que alta son dígitos pegados
  digit_aspect: 0.62          # ancho típico de un dígito / su alto si no se puede medir en la foto
  pitch_factor: 1.15          # dos caracteres son del mismo número si sus centros distan como mucho
                              # 1,15 veces el paso entre dígitos de la fuente (medido en cada foto)
  max_digit_gap: 0.7          # y el hueco entre sus cajas no pasa de 0,7 alturas de carácter
  max_height_ratio: 1.6       # dígitos de un mismo número con alturas parecidas
  max_digits: 3               # números del 1 al 999; un grupo más largo es una palabra
  number_min_score: 0.70      # similitud media mínima con las plantillas para ser un número
  ocr_min_confidence: 0.60    # por debajo, el número se queda con value null
  template_fonts: [arial.ttf, arialbd.ttf, calibri.ttf, calibrib.ttf, times.ttf, timesbd.ttf,
                   verdana.ttf, verdanab.ttf, tahoma.ttf, tahomabd.ttf, georgia.ttf, georgiab.ttf,
                   cour.ttf, courbd.ttf, consola.ttf, comic.ttf, comicbd.ttf, segoeui.ttf,
                   segoeuib.ttf, trebuc.ttf, sans]
  try_rotations: true         # leer los números también con la foto girada 90°, 180° y 270° (fichas de lado)
  # Segundo intento para números muy claros: solo si la primera lectura recupera menos del 95 %
  # de la secuencia 1..N; se queda la mejor lectura (las fotos que salen bien no cambian)
  retry_below: 0.95
  retries:
    - {ink_threshold: [0.05, 0.12], ink_relative: 0.2}   # umbrales más bajos: no perder lo claro
    - {blur: 0.8}                                         # oscuridad suavizada: une trazos rotos
  join_in_order: false

# -----------------------------------------------------------------------------
# Fotos reales: fotogramas de vídeo (python -m tools.extract_frames) y etiquetado con SAM
# (python -m tools.annotate_sam). Adaptado de sacar_fotogramas.py y etiquetar_sam.py de clase.
# -----------------------------------------------------------------------------
real_data:
  videos: data/real/videos            # vídeos grabados con la cámara del proyecto (no se suben a git)
  images: data/real/images            # fotogramas: vXX_NNNNN.jpg (vídeo XX, fotograma NNNNN)
  annotations: data/real/annotations  # un JSON por fotograma, en el formato común
  frame_step: 15                      # una foto de cada 15 fotogramas (medio segundo a 30 fps)
  min_sharpness: 0                    # descartar fotogramas movidos: varianza del Laplaciano mínima
                                      # (0 = guardarlos todos; el valor depende de la cámara)
  jpeg_quality: 95

annotation:
  sam_model: ArtificialVision/models/sam2.1_b.pt   # SAM 2.1 base; se descarga solo la primera vez
  crop_px: 256                # SAM recibe un recorte de 256 x 256 px alrededor del clic, no la foto entera.
                              # SAM amplía su entrada a 1024 px, así que el punto se ve 4 veces más grande.
                              # Medido con 20 puntos y 20 números de una foto sintética a 2,7 px/mm: IoU >= 0,7
                              # con la caja real en el 100 % de los puntos y el 95 % de los números (foto
                              # entera: 90 % y 65 %)
  max_box_px: {dot: 60, number: 160}   # una caja de SAM mayor que esto es un error (ha cogido la hoja, una
                                       # sombra...): se descarta y hay que dibujar la caja arrastrando

# -----------------------------------------------------------------------------
# Emparejamiento y evaluación, comunes a los dos enfoques
# (common/matching.py y python -m common.evaluation)
# -----------------------------------------------------------------------------
matching:
  max_distance_factor: 3.0    # sin pareja por encima de 3 veces la altura mediana de los números

evaluation:
  dot_tolerance_px: 8         # un punto predicho acierta si su centro cae a menos de esto de uno real
  number_overlap: 0.5         # solape mínimo entre la caja predicha de un número y la real, medido como
                              # intersección / área de la caja menor (no IoU: el OCR da cajas más holgadas)

# -----------------------------------------------------------------------------
# Prueba rápida (opción --quick de los tres scripts): dataset mini y 2 épocas
# -----------------------------------------------------------------------------
quick:
  data_output: data/synthetic_quick
  splits: {train: 16, val: 4, test: 4}
  yolo_output: ArtificialVision/yolo_dataset_quick
  epochs: 2

# -----------------------------------------------------------------------------
# Rotuladores Edding 1200 (ArtificialVision/pens/): YOLO (1 clase) + SAM + color en HSV + ArUco
#
# Flujo: pens.frames -> pens.label_sam -> pens.prepare_dataset -> pens.train -> pens.pipeline
# Cómo grabar los vídeos: Documentacion_Rotuladores/video.md
# -----------------------------------------------------------------------------
pens:
  classes: [rotulador]        # una sola clase: el color lo decide el HSV, no YOLO
  videos: data/pens/videos    # vídeos de los rotuladores (no se suben a git)
  frames: data/pens/frames    # fotos sacadas de los vídeos
  labels: data/pens/labels    # etiquetas YOLO hechas con SAM
  frame_step: 20              # intervalo utilizado al extraer las fotos de las etiquetas versionadas
  min_sharpness: 30           # nitidez mínima de aquella extracción (varianza del Laplaciano)
  dataset: ArtificialVision/pens_dataset   # dataset montado (train/val por vídeo) y su data.yaml
  model: ArtificialVision/models/yolo26n_pens.pt   # modelo entrenado
  sam_model: ArtificialVision/models/sam2.1_b.pt  # pesos de SAM 2.1 (los mismos que annotation.sam_model)
  segmenter: sam              # sam: silueta con SAM a partir de la caja de YOLO; grabcut: con GrabCut (tema 5)
  imgsz: 640                  # los rotuladores son grandes en la foto: no hace falta 1024 ni teselas
  detection_confidence: 0.4
  output: ArtificialVision/results/pens
  training:
    epochs: 100
    patience: 20              # parada temprana
    batch: 16
    seed: 42
    fliplr: 0.5               # volteos permitidos: un rotulador puede estar en cualquier orientación
    flipud: 0.5
    degrees: 0.0              # sin giros: las cajas de YOLO son rectas y se agrandarían
    scale: 0.3
    project: ArtificialVision/results/training
    name: yolo26n_pens
  color:                      # reglas HSV (OpenCV: H de 0 a 179, S y V de 0 a 255)
    min_saturation: 90        # un píxel "de color" necesita saturación...
    min_value: 60             # ...y brillo suficientes (si no, es blanco, gris o sombra)
    blue_hue: [95, 130]
    red_hue: [10, 170]        # rojo: H <= 10 o H >= 170 (el rojo está en los dos extremos del círculo)
    black_max_value: 60       # negro: brillo muy bajo, sea cual sea el tono
    min_color_fraction: 0.04  # al menos un 4 % de la silueta roja o azul (capuchón y tapón)
    min_black_fraction: 0.08  # al menos un 8 % negro (más que las letras impresas en el cuerpo)
